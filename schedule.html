<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Appointment with Kai Tuning</title>
        <link rel="icon" type="image/png" href="favicon.ico" />
        <link rel="stylesheet" href="main.css" />
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    </head>

    <body class="page">
        <header>
            <h1>Kai Tuning<sup>&reg;</sup></h1>
            <nav class="tabbar">
                <a class="tab" href="index.html">
                    <span class="icon">
                        🏠
                    </span>
                    Home
                </a>
                <a class="tab" href="account.html">
                    <span class="icon">
                        👤
                    </span>
                    Account
                </a>
                <a class="tab active" href="schedule.html">
                    <span class="icon">
                        📅
                    </span>
                    Schedule
                </a>
                <a class="tab" href="about.html">
                    <span class="icon">
                        ℹ️
                    </span>
                    About
                </a>
            </nav>
            <hr />
        </header>

        <main>
        <p class="note">Pick a date, choose a time slot, then submit.</p>

        <form id="apptForm">
            <div class="row">
            <label for="apptDate"><strong>Date:</strong></label><br />
            <input id="apptDate" name="date" type="date" required />
            </div>
            <!-- Will get updated realtime -->
            <div class="row">
            <strong>Time slot:</strong>
            <div class="slots" id="slots">
                <button class="slot" type="button" data-time="09:00">9:00 AM</button>
                <button class="slot" type="button" data-time="10:00">10:00 AM</button>
                <button class="slot" type="button" data-time="11:00">11:00 AM</button>
                <button class="slot" type="button" data-time="13:00">1:00 PM</button>
                <button class="slot" type="button" data-time="14:00">2:00 PM</button>
                <button class="slot" type="button" data-time="15:00">3:00 PM</button>
            </div>

            <!-- this is what actually gets "submitted" -->
            <input type="hidden" id="apptTime" name="time" required />
            </div>

            <div class="row">
            <label for="service"><strong>Service:</strong></label><br />
            <select id="service" name="service" required>
                <option value="">Choose one…</option>
                <option value="tune">Performance Tune</option>
                <option value="inspect">Full Inspection</option>
                <option value="diagnostic">ECU Diagnostic</option>
                <option value="consult">Consulting</option>
            </select>
            </div>

            <div class="actions">
            <button type="submit">Schedule appointment</button>
            <button type="reset">Clear</button>
            </div>
        </form>
        <p id="result" role="status" aria-live="polite"></p>
        </main>

        <footer class="bg-dark text-light mt-5 border-top border-primary">
        <div class="container py-4 text-center">
            <p class="mb-1">Author: <strong>Vance Williams</strong></p>
            <a 
            href="https://github.com/Vaoikun/startup" 
            class="link-light link-offset-2 link-underline-opacity-25 link-underline-opacity-100-hover"
            >
            GitHub Repository
            </a>
        </div>
        </footer>
    </body>
</html>
